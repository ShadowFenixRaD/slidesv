<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slidesv — Live Presentation</title>
  <style>:root {
  --bg: #0b0e14;
  --surface: #151a24;
  --surface-2: #1e2534;
  --border: rgba(255, 255, 255, 0.12);
  --text: #eef2f8;
  --muted: #9aa5b8;
  --accent: #3b82f6;
  --accent-hover: #60a5fa;
  --danger: #ef4444;
  --success: #10b981;
  --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  overflow: hidden;
  user-select: none;
}

.hidden {
  display: none !important;
}

/* Stage */
.stage-wrapper {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  overflow: hidden;
}

.slide-container {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.slide-frame {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  opacity: 0;
  pointer-events: none;
  z-index: 1;
}

.slide-frame.active {
  opacity: 1;
  pointer-events: auto;
  z-index: 2;
}

/* Transitions */
.slide-frame[data-transition="fade"] {
  transition: opacity 0.35s ease;
}

.slide-frame[data-transition="slide"] {
  transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  transform: translateX(4%);
}
.slide-frame[data-transition="slide"].active {
  transform: translateX(0);
}

.slide-frame[data-transition="zoom"] {
  transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  transform: scale(0.95);
}
.slide-frame[data-transition="zoom"].active {
  transform: scale(1);
}

.slide-frame[data-transition="none"] {
  transition: none;
}

.slide-layers-grid {
  display: grid;
  width: 100%;
  height: 100%;
  place-items: center;
}

.layer-slot {
  grid-area: 1 / 1;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.layer-slot > svg {
  width: 100%;
  height: 100%;
  max-width: 100vw;
  max-height: 100vh;
  display: block;
}

.layer-slot.layer-hidden {
  opacity: 0 !important;
  visibility: hidden;
  pointer-events: none;
}

/* Slide 0 Starter */
.starter-view {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: radial-gradient(circle at 20% 15%, #192236 0%, var(--bg) 65%);
  overflow-y: auto;
  padding: 2.5rem 1.5rem;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  user-select: text;
}

.starter-card {
  width: 100%;
  max-width: 920px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
}

.starter-header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
}

.starter-title h1 {
  margin: 0;
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.starter-title p {
  margin: 0.35rem 0 0;
  color: var(--muted);
  font-size: 0.92rem;
}

.starter-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.65rem 1.15rem;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  font-family: inherit;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}

.btn:hover {
  background: #273044;
  border-color: rgba(255, 255, 255, 0.25);
}

.btn:active {
  transform: translateY(1px);
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.btn-primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

.btn-sm {
  padding: 0.35rem 0.7rem;
  font-size: 0.8rem;
  border-radius: 7px;
}

.btn-pill {
  border-radius: 999px;
}

.btn.is-active {
  background: rgba(59, 130, 246, 0.22);
  border-color: var(--accent);
  color: #fff;
}

.starter-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 0.9rem;
  margin: 1.5rem 0;
}

.stat-box {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.9rem 1rem;
}

.stat-label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.stat-value {
  margin-top: 0.3rem;
  font-size: 1.35rem;
  font-weight: 700;
}

.starter-section {
  margin-top: 1.5rem;
}

.starter-section h2 {
  margin: 0 0 0.75rem;
  font-size: 0.95rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}

.pill-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
}

.group-block {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.9rem 1rem;
  margin-bottom: 0.75rem;
}

.group-name {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 0.55rem;
}

kbd {
  display: inline-block;
  padding: 0.12rem 0.42rem;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 4px;
  color: #d6e0f0;
}

.shortcuts-help {
  margin-top: 1.5rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1.25rem;
  font-size: 0.82rem;
  color: var(--muted);
}

/* Floating HUD */
.hud-bar {
  position: fixed;
  right: 1rem;
  bottom: 1rem;
  z-index: 40;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.45rem;
  padding: 0.45rem 0.65rem;
  background: rgba(15, 20, 30, 0.86);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  max-width: calc(100vw - 2rem);
}

.hud-counter {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--text);
  padding: 0 0.4rem;
}

.hud-sep {
  width: 1px;
  height: 18px;
  background: var(--border);
}

.hud-select {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.25rem 0.45rem;
  font-size: 0.78rem;
  font-family: inherit;
}

/* Overview Grid */
.overview-modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(8, 10, 15, 0.94);
  backdrop-filter: blur(8px);
  padding: 2rem;
  overflow-y: auto;
}

.overview-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
}

.overview-header h2 {
  margin: 0;
  font-size: 1.25rem;
}

.overview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1.25rem;
}

.overview-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s ease, transform 0.15s ease;
}

.overview-card:hover {
  border-color: var(--accent-hover);
  transform: translateY(-2px);
}

.overview-card.current {
  border-color: var(--accent);
}

.overview-thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.overview-thumb .slide-layers-grid {
  width: 100%;
  height: 100%;
}

.overview-thumb .layer-slot > svg {
  max-width: 100%;
  max-height: 100%;
}

.overview-meta {
  padding: 0.6rem 0.8rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.85rem;
}

.overview-num {
  font-family: var(--font-mono);
  color: var(--muted);
}

/* Drawing Canvas & Laser */
.draw-canvas {
  position: fixed;
  inset: 0;
  z-index: 35;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
}

.draw-canvas.drawing-active {
  pointer-events: auto;
  cursor: crosshair;
}

.laser-dot {
  position: fixed;
  width: 18px;
  height: 18px;
  margin-left: -9px;
  margin-top: -9px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, #ff2e2e 45%, rgba(255, 0, 0, 0) 75%);
  box-shadow: 0 0 14px 5px rgba(255, 40, 40, 0.75);
  pointer-events: none;
  z-index: 60;
}

/* Presenter View */
.presenter-layout {
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  grid-template-rows: auto 1fr auto;
  gap: 1rem;
  width: 100vw;
  height: 100vh;
  padding: 1rem;
  background: var(--bg);
}

.presenter-topbar {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.65rem 1rem;
}

.presenter-timers {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  font-family: var(--font-mono);
  font-size: 1.05rem;
}

.presenter-main-preview {
  background: #000;
  border: 1px solid var(--border);
  border-radius: 10px;
  display: grid;
  place-items: center;
  overflow: hidden;
  position: relative;
}

.presenter-main-preview .slide-layers-grid,
.presenter-next-preview .slide-layers-grid {
  width: 100%;
  height: 100%;
}

.presenter-main-preview .layer-slot > svg,
.presenter-next-preview .layer-slot > svg {
  max-width: 100%;
  max-height: 100%;
}

.presenter-side {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  min-height: 0;
}

.presenter-next-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.presenter-next-preview {
  aspect-ratio: 16 / 9;
  width: 100%;
  background: #000;
  border-radius: 6px;
  overflow: hidden;
  display: grid;
  place-items: center;
}

.presenter-notes-box {
  flex: 1;
  min-height: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.9rem 1rem;
  display: flex;
  flex-direction: column;
}

.presenter-notes-content {
  flex: 1;
  overflow-y: auto;
  white-space: pre-wrap;
  line-height: 1.55;
  font-size: 0.98rem;
  color: var(--text);
  user-select: text;
}

.presenter-footer {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 0.75rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.6rem 1rem;
}

.presenter-controls-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem;
}

.presenter-ctrl-group {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.2rem 0.45rem;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
}

.presenter-ctrl-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  margin-right: 0.15rem;
}

.box-label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}
</style>

'use strict';
// --- src/core/types.ts ---
                                                          

                                                                

                                
                
              
                  
 

                                 
              
                          
                       
                    
 

                                 
              
                      
              
                  
                    
 

                                  
                   
                           
                
                   
                  
                 
               
                             
                       
                     
                      
                              
 

                                    
                   
                           
                
                   
                    
 

                             
                        
                     
 

                               
                          
                  
 

                                
             
                        
                    
                
 

                                
                
                
                             
                  
                          
                
 

                                  
               
            
                     
                  
                       
                                
      
 

                                   
                   
                
                     
                              
 

                           
                      
                          
                      
                            
                              
                    
 


// --- src/core/parser.ts ---
             
            
                  
                 
                 
                    
                
                 
                    

const SELECTOR_REGEX = /^!?(\d+(_\d+)?)(,!?(\d+(_\d+)?))*$/;
const VALID_TRANSITIONS = new Set        (['fade', 'slide', 'zoom', 'none']);
const MODIFIER_ALIASES                         = {
  ctrl: 'ctrl',
  control: 'ctrl',
  alt: 'alt',
  option: 'alt',
  shift: 'shift',
  win: 'meta',
  meta: 'meta',
  cmd: 'meta',
  super: 'meta',
};

function parseSelector(token        )                 {
  const parts = token.split(',');
  const ranges                  = [];
  let hasPositive = false;

  for (const rawPart of parts) {
    const negate = rawPart.startsWith('!');
    const clean = negate ? rawPart.slice(1) : rawPart;
    const [aStr, bStr] = clean.split('_');
    const a = Number.parseInt(aStr, 10);
    const b = bStr !== undefined ? Number.parseInt(bStr, 10) : a;
    const start = Math.min(a, b);
    const end = Math.max(a, b);
    if (!negate) {
      hasPositive = true;
    }
    ranges.push({ start, end, negate });
  }

  return {
    raw: token,
    ranges,
    hasPositive,
    isGlobal: false,
  };
}

function createGlobalSelector()                 {
  return {
    raw: '',
    ranges: [],
    hasPositive: false,
    isGlobal: true,
  };
}

function matchesSlide(selector                , slideNumber        )          {
  if (slideNumber < 1) return false;
  if (selector.isGlobal) return true;

  let included = !selector.hasPositive;
  if (selector.hasPositive) {
    for (const r of selector.ranges) {
      if (!r.negate && slideNumber >= r.start && slideNumber <= r.end) {
        included = true;
        break;
      }
    }
  }

  if (!included) return false;

  for (const r of selector.ranges) {
    if (r.negate && slideNumber >= r.start && slideNumber <= r.end) {
      return false;
    }
  }

  return true;
}

function parseShortcutToken(token        )                        {
  if (!token.startsWith('s_')) return null;
  const parts = token
    .slice(2)
    .split('_')
    .map((p) => p.toLowerCase())
    .filter(Boolean);
  if (parts.length === 0) return null;

  const key = parts[parts.length - 1];
  const rawMods = parts.slice(0, -1);
  const modifiers           = [];
  for (const m of rawMods) {
    const normalized = MODIFIER_ALIASES[m] ?? m;
    if (!modifiers.includes(normalized)) {
      modifiers.push(normalized);
    }
  }

  const orderedMods = ['ctrl', 'alt', 'shift', 'meta'].filter((m) =>
    modifiers.includes(m),
  );
  const extraMods = modifiers.filter((m) => !orderedMods.includes(m));
  const finalMods = [...orderedMods, ...extraMods];

  const display = [...rawMods, key].join('+');
  const signature = [...finalMods, key].join('+');

  return {
    raw: token,
    modifiers: finalMods,
    key,
    display,
    signature,
  };
}

function basenameOf(filepath        )         {
  const clean = filepath.split('?')[0].split('#')[0];
  const idx = Math.max(clean.lastIndexOf('/'), clean.lastIndexOf('\\'));
  return idx >= 0 ? clean.slice(idx + 1) : clean;
}

function parseSvgFilename(filepath        )                         {
  const filename = basenameOf(filepath);
  if (!filename.toLowerCase().endsWith('.svg')) return null;

  const stem = filename.slice(0, -4);
  if (!stem) return null;

  const tokens = stem.split('-');
  let cursor = 0;

  let selector                ;
  if (SELECTOR_REGEX.test(tokens[0])) {
    selector = parseSelector(tokens[0]);
    cursor = 1;
  } else {
    selector = createGlobalSelector();
  }

  const rawTitle = tokens[cursor] ?? 'untitled';
  const title = rawTitle.replace(/_/g, ' ').trim() || 'untitled';
  cursor += 1;

  let band            = 'normal';
  let zIndex = 0;
  let step = 0;
  let transition                 = 'fade';
  let group                = null;
  let isDefault = false;
  const languages           = [];
  const shortcuts                   = [];

  for (let i = cursor; i < tokens.length; i += 1) {
    const tok = tokens[i];
    if (!tok) continue;

    if (tok === 'underlay' || tok.startsWith('underlay_')) {
      band = 'underlay';
      let z = 0;
      if (tok.startsWith('underlay_')) {
        const parsedZ = Number.parseInt(tok.slice('underlay_'.length), 10);
        if (!Number.isNaN(parsedZ)) z = parsedZ;
      } else if (i + 1 < tokens.length && /^\d+$/.test(tokens[i + 1])) {
        z = Number.parseInt(tokens[i + 1], 10);
        i += 1;
      }
      zIndex = -1000 + z;
    } else if (tok === 'overlay' || tok.startsWith('overlay_')) {
      band = 'overlay';
      let z = 0;
      if (tok.startsWith('overlay_')) {
        const parsedZ = Number.parseInt(tok.slice('overlay_'.length), 10);
        if (!Number.isNaN(parsedZ)) z = parsedZ;
      } else if (i + 1 < tokens.length && /^\d+$/.test(tokens[i + 1])) {
        z = Number.parseInt(tokens[i + 1], 10);
        i += 1;
      }
      zIndex = 1000 + z;
    } else if (tok.startsWith('step_')) {
      const k = Number.parseInt(tok.slice('step_'.length), 10);
      if (!Number.isNaN(k) && k >= 0) {
        step = k;
      }
    } else if (tok.startsWith('t_')) {
      const t = tok.slice('t_'.length).toLowerCase();
      if (VALID_TRANSITIONS.has(t)) {
        transition = t                  ;
      }
    } else if (tok.startsWith('g_')) {
      const g = tok.slice('g_'.length).trim();
      if (g) group = g;
    } else if (tok === 'default') {
      isDefault = true;
    } else if (tok.startsWith('lang_')) {
      const codes = tok
        .slice('lang_'.length)
        .split('_')
        .map((c) => c.trim().toLowerCase())
        .filter(Boolean);
      for (const c of codes) {
        if (!languages.includes(c)) {
          languages.push(c);
        }
      }
    } else if (tok.startsWith('s_')) {
      const sc = parseShortcutToken(tok);
      if (sc) shortcuts.push(sc);
    }
  }

  return {
    filename,
    selector,
    title,
    rawTitle,
    band,
    zIndex,
    step,
    transition,
    group,
    isDefault,
    languages,
    shortcuts,
  };
}

function parseSidecarFilename(filepath        )                           {
  const filename = basenameOf(filepath);
  const lower = filename.toLowerCase();
  let ext                      = null;
  if (lower.endsWith('.md')) ext = 'md';
  else if (lower.endsWith('.txt')) ext = 'txt';
  if (!ext) return null;

  const stem = filename.slice(0, -(ext.length + 1));
  if (!stem) return null;

  const tokens = stem.split('-');
  let selector                ;
  let rawTitle        ;

  if (SELECTOR_REGEX.test(tokens[0])) {
    selector = parseSelector(tokens[0]);
    rawTitle = tokens[1] ?? '';
  } else {
    selector = createGlobalSelector();
    rawTitle = tokens[0] ?? '';
  }

  const title = rawTitle.replace(/_/g, ' ').trim();

  return {
    filename,
    selector,
    title,
    rawTitle,
    ext,
  };
}

function computeTotalSlides(layers                   )         {
  if (layers.length === 0) return 0;
  let maxSlide = 0;
  for (const layer of layers) {
    for (const r of layer.selector.ranges) {
      if (!r.negate && r.end > maxSlide) {
        maxSlide = r.end;
      }
    }
  }
  return Math.max(1, maxSlide);
}

function isLayerDefaultActive(meta                 )          {
  if (meta.isDefault) return true;
  if (meta.shortcuts.length > 0) return false;
  if (meta.group !== null) return false;
  return true;
}


// --- src/core/compositor.ts ---

function escapeXmlText(value        )         {
  return value
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

function resolvePlaceholders(markup        , ctx                    )         {
  return markup
    .replace(/\{\{INDEX\}\}/g, String(ctx.index))
    .replace(/\{\{TOTAL\}\}/g, String(ctx.total))
    .replace(/\{\{TITLE\}\}/g, escapeXmlText(ctx.title))
    .replace(/\{\{PROGRESS\}\}/g, String(ctx.progress))
    .replace(/\{\{DATE\}\}/g, escapeXmlText(ctx.date));
}

function extractSvgDesc(svgMarkup        )           {
  const results           = [];
  const descRegex = /<desc\b[^>]*>([\s\S]*?)<\/desc>/gi;
  let match                        ;
  while ((match = descRegex.exec(svgMarkup)) !== null) {
    const text = match[1].replace(/<[^>]+>/g, '').trim();
    if (text) results.push(text);
  }
  return results;
}

function extractSystemLanguages(svgMarkup        )           {
  const langs           = [];
  const attrRegex = /\bsystemLanguage\s*=\s*(?:"([^"]*)"|'([^']*)')/gi;
  let match                        ;
  while ((match = attrRegex.exec(svgMarkup)) !== null) {
    const raw = match[1] ?? match[2] ?? '';
    for (const part of raw.split(',')) {
      const code = part.trim().toLowerCase();
      if (code && !langs.includes(code)) {
        langs.push(code);
      }
    }
  }
  return langs;
}

function rewriteSmilTimingList(value        , prefix        , knownIds             )         {
  return value
    .split(';')
    .map((item) => {
      const trimmed = item.trim();
      if (!trimmed) return item;
      return trimmed.replace(
        /\b([A-Za-z_][A-Za-z0-9_:-]*)\.([A-Za-z_][A-Za-z0-9_()-]*)/g,
        (full, idPart        , eventPart        ) => {
          if (knownIds.has(idPart)) {
            return `${prefix}${idPart}.${eventPart}`;
          }
          return full;
        },
      );
    })
    .join(';');
}

function sanitizeAndNamespaceSvg(
  rawSvg        ,
  prefix        ,
  band           ,
)         {
  let svg = rawSvg
    .replace(/^\uFEFF/, '')
    .replace(/<\?xml[\s\S]*?\?>\s*/gi, '')
    .replace(/<!DOCTYPE[\s\S]*?>\s*/gi, '')
    .trim();

  // Sanitize root <svg ...> attributes
  svg = svg.replace(/<svg\b([^>]*)>/i, (_full, attrs        ) => {
    let cleaned = attrs;

    const hasViewBox = /\bviewBox\s*=/i.test(cleaned);
    if (!hasViewBox) {
      const wMatch = cleaned.match(/\bwidth\s*=\s*(?:"([0-9.]+)(?:px)?"|'([0-9.]+)(?:px)?')/i);
      const hMatch = cleaned.match(/\bheight\s*=\s*(?:"([0-9.]+)(?:px)?"|'([0-9.]+)(?:px)?')/i);
      const w = wMatch?.[1] ?? wMatch?.[2];
      const h = hMatch?.[1] ?? hMatch?.[2];
      if (w && h) {
        cleaned += ` viewBox="0 0 ${w} ${h}"`;
      }
    }

    cleaned = cleaned
      .replace(/\s+\bwidth\s*=\s*(?:"[^"]*"|'[^']*')/gi, '')
      .replace(/\s+\bheight\s*=\s*(?:"[^"]*"|'[^']*')/gi, '');

    if (band === 'underlay' || band === 'overlay') {
      if (/\bstyle\s*=\s*"([^"]*)"/i.test(cleaned)) {
        cleaned = cleaned.replace(/\bstyle\s*=\s*"([^"]*)"/i, (_s, styleVal        ) => {
          const filtered = styleVal
            .split(';')
            .map((p) => p.trim())
            .filter((p) => p && !/^background(-color)?\s*:/i.test(p));
          filtered.push('background: transparent');
          return `style="${filtered.join('; ')}"`;
        });
      } else {
        cleaned += ' style="background: transparent"';
      }
    }

    return `<svg${cleaned}>`;
  });

  // Convert systemLanguage to data-system-language so JS controls <switch> visibility
  svg = svg.replace(
    /\bsystemLanguage\s*=\s*("[^"]*"|'[^']*')/gi,
    'data-system-language=$1',
  );

  // Collect all IDs in this SVG
  const knownIds = new Set        ();
  const idRegex = /\bid\s*=\s*(?:"([^"]+)"|'([^']+)')/g;
  let idMatch                        ;
  while ((idMatch = idRegex.exec(svg)) !== null) {
    const idVal = idMatch[1] ?? idMatch[2];
    if (idVal) knownIds.add(idVal);
  }

  if (knownIds.size > 0) {
    // Namespace id="..."
    svg = svg.replace(/\bid\s*=\s*("([^"]+)"|'([^']+)')/g, (_m, _q, dVal        , sVal        ) => {
      const val = dVal ?? sVal;
      return `id="${prefix}${val}"`;
    });

    // Namespace url(#...)
    svg = svg.replace(/url\(\s*#([^)\s'"]+)\s*\)/g, (_m, refId        ) => {
      return knownIds.has(refId) ? `url(#${prefix}${refId})` : `url(#${refId})`;
    });

    // Namespace href="#..." and xlink:href="#..."
    svg = svg.replace(
      /\b((?:xlink:)?href)\s*=\s*(?:"(#[^"]*)"|'(#[^']*)')/gi,
      (full, attrName        , dHref        , sHref        ) => {
        const href = dHref ?? sHref;
        const refId = href.slice(1);
        if (knownIds.has(refId)) {
          return `${attrName}="#${prefix}${refId}"`;
        }
        return full;
      },
    );

    // Namespace SMIL begin="..." and end="..."
    svg = svg.replace(
      /\b(begin|end)\s*=\s*(?:"([^"]*)"|'([^']*)')/gi,
      (_full, attrName        , dVal        , sVal        ) => {
        const val = dVal ?? sVal ?? '';
        const rewritten = rewriteSmilTimingList(val, prefix, knownIds);
        return `${attrName}="${rewritten}"`;
      },
    );
  }

  return svg;
}

function composeDeck(
  layerInputs              ,
  sidecarInputs                 = [],
  buildDate         ,
)           {
  const dateStr = buildDate ?? new Date().toISOString().slice(0, 10);
  const totalSlides = computeTotalSlides(layerInputs.map((l) => l.meta));

  const languages           = [];
  const addLang = (code        ) => {
    const norm = code.trim().toLowerCase();
    if (norm && !languages.includes(norm)) {
      languages.push(norm);
    }
  };

  const groupMap = new Map                         ();
  const toggles                     = [];
  const seenToggleKeys = new Set        ();

  for (const input of layerInputs) {
    const { meta, svgContent } = input;
    for (const l of meta.languages) addLang(l);
    for (const l of extractSystemLanguages(svgContent)) addLang(l);

    if (meta.group) {
      let groupInfo = groupMap.get(meta.group);
      if (!groupInfo) {
        groupInfo = { name: meta.group, options: [] };
        groupMap.set(meta.group, groupInfo);
      }
      if (!groupInfo.options.some((o) => o.layerKey === meta.filename)) {
        groupInfo.options.push({
          layerKey: meta.filename,
          title: meta.title,
          isDefault: meta.isDefault,
          shortcuts: meta.shortcuts,
        });
      }
    } else if (meta.shortcuts.length > 0 && !seenToggleKeys.has(meta.filename)) {
      seenToggleKeys.add(meta.filename);
      toggles.push({
        layerKey: meta.filename,
        title: meta.title,
        isDefault: meta.isDefault,
        shortcuts: meta.shortcuts,
      });
    }
  }

  // Ensure each radio group has a default if none was explicitly marked
  for (const group of groupMap.values()) {
    if (group.options.length > 0 && !group.options.some((o) => o.isDefault)) {
      group.options[0].isDefault = true;
    }
  }

  const slides                  = [];

  for (let slideIndex = 1; slideIndex <= totalSlides; slideIndex += 1) {
    const matching = layerInputs
      .map((input, idx) => ({ input, idx }))
      .filter(({ input }) => matchesSlide(input.meta.selector, slideIndex));

    matching.sort((a, b) => {
      if (a.input.meta.zIndex !== b.input.meta.zIndex) {
        return a.input.meta.zIndex - b.input.meta.zIndex;
      }
      if (a.input.meta.step !== b.input.meta.step) {
        return a.input.meta.step - b.input.meta.step;
      }
      return a.idx - b.idx;
    });

    const primaryNormal = matching.find((m) => m.input.meta.band === 'normal');
    const slideTitle =
      primaryNormal?.input.meta.title ??
      matching[0]?.input.meta.title ??
      `Slide ${slideIndex}`;

    const transition                 =
      primaryNormal?.input.meta.transition ??
      matching[0]?.input.meta.transition ??
      'fade';

    const progress =
      totalSlides > 0 ? Math.round((slideIndex / totalSlides) * 100) : 0;

    const ctx                     = {
      index: slideIndex,
      total: totalSlides,
      title: slideTitle,
      progress,
      date: dateStr,
    };

    let maxStep = 0;
    const composedLayers                  = [];
    const noteParts           = [];

    matching.forEach(({ input }, layerOrder) => {
      if (input.meta.step > maxStep) {
        maxStep = input.meta.step;
      }
      const prefix = `s${slideIndex}_l${layerOrder}_`;
      const sanitized = sanitizeAndNamespaceSvg(
        input.svgContent,
        prefix,
        input.meta.band,
      );
      const resolved = resolvePlaceholders(sanitized, ctx);

      if (input.meta.band === 'normal') {
        for (const desc of extractSvgDesc(input.svgContent)) {
          if (!noteParts.includes(desc)) {
            noteParts.push(desc);
          }
        }
      }

      composedLayers.push({
        id: `${prefix}root`,
        meta: input.meta,
        svgMarkup: resolved,
        order: layerOrder,
      });
    });

    const matchingSidecars = sidecarInputs.filter((sc) =>
      matchesSlide(sc.meta.selector, slideIndex),
    );
    for (const sc of matchingSidecars) {
      const trimmed = sc.content.trim();
      if (trimmed) {
        noteParts.unshift(trimmed);
      }
    }

    slides.push({
      index: slideIndex,
      title: slideTitle,
      transition,
      maxStep,
      layers: composedLayers,
      notes: noteParts.join('\n\n'),
    });
  }

  return {
    totalSlides,
    slides,
    languages,
    groups: Array.from(groupMap.values()),
    toggles,
    buildDate: dateStr,
  };
}

function eventMatchesShortcut(e               , sc                )          {
  const key = e.key.toLowerCase();
  if (key !== sc.key) return false;
  const needCtrl = sc.modifiers.includes('ctrl');
  const needAlt = sc.modifiers.includes('alt');
  const needShift = sc.modifiers.includes('shift');
  const needMeta = sc.modifiers.includes('meta');
  return (
    e.ctrlKey === needCtrl &&
    e.altKey === needAlt &&
    e.shiftKey === needShift &&
    e.metaKey === needMeta
  );
}

function isLayerEligibleForState(
  layer               ,
  state                                                                       ,
)          {
  const { meta } = layer;
  if (
    meta.languages.length > 0 &&
    state.activeLanguage &&
    !meta.languages.includes(state.activeLanguage.toLowerCase())
  ) {
    return false;
  }
  if (meta.group !== null) {
    return state.groupChoices[meta.group] === meta.filename;
  }
  if (meta.shortcuts.length > 0) {
    return Boolean(state.toggles[meta.filename]);
  }
  return true;
}

function getAvailableStepsForSlide(
  slide               ,
  state                                                                       ,
)           {
  const stepSet = new Set        ([0]);
  for (const layer of slide.layers) {
    if (layer.meta.step > 0 && isLayerEligibleForState(layer, state)) {
      stepSet.add(layer.meta.step);
    }
  }
  return Array.from(stepSet).sort((a, b) => a - b);
}

class SyncBus {
          channel                          = null;
          storageKey = 'slidesv_sync_msg';
          listeners                                    = [];

  constructor(channelName = 'slidesv-sync') {
    if (typeof BroadcastChannel !== 'undefined') {
      try {
        this.channel = new BroadcastChannel(channelName);
        this.channel.onmessage = (ev              ) => {
          if (ev.data && typeof ev.data === 'object') {
            this.emit(ev.data               );
          }
        };
      } catch {
        this.channel = null;
      }
    }

    if (typeof window !== 'undefined') {
      window.addEventListener('storage', (ev              ) => {
        if (ev.key === this.storageKey && ev.newValue) {
          try {
            const parsed = JSON.parse(ev.newValue)                        ;
            if (parsed && parsed.msg) {
              this.emit(parsed.msg);
            }
          } catch {
            // ignore malformed storage payload
          }
        }
      });
    }
  }

  onMessage(cb                            )       {
    this.listeners.push(cb);
  }

  send(msg             )       {
    if (this.channel) {
      try {
        this.channel.postMessage(msg);
      } catch {
        // ignore channel errors
      }
    }
    try {
      localStorage.setItem(
        this.storageKey,
        JSON.stringify({ ts: Date.now(), rand: Math.random(), msg }),
      );
    } catch {
      // ignore storage quota/security errors
    }
  }

          emit(msg             )       {
    for (const cb of this.listeners) {
      cb(msg);
    }
  }
}

function matchLanguageTag(attrValue        , activeLang        )          {
  if (!activeLang) return false;
  const target = activeLang.toLowerCase();
  const targetBase = target.split('-')[0];
  const candidates = attrValue
    .split(',')
    .map((s) => s.trim().toLowerCase())
    .filter(Boolean);

  for (const c of candidates) {
    if (c === target || c === targetBase) return true;
    if (c.split('-')[0] === targetBase) return true;
  }
  return false;
}

function applySwitchLanguage(root         , activeLang        )       {
  const switches = root.querySelectorAll('switch');
  switches.forEach((sw) => {
    const children = Array.from(sw.children);
    let matched                 = null;
    let fallback                 = null;

    for (const child of children) {
      const langAttr = child.getAttribute('data-system-language');
      if (langAttr === null) {
        if (!fallback) fallback = child;
      } else if (!matched && matchLanguageTag(langAttr, activeLang)) {
        matched = child;
      }
    }

    const winner = matched ?? fallback;
    for (const child of children) {
      const el = child                            ;
      if (child === winner) {
        el.style.display = '';
      } else {
        el.style.display = 'none';
      }
    }
  });
}

function resetAndPlaySvgAnimations(svg               )       {
  try {
    if (typeof svg.pauseAnimations === 'function') {
      svg.pauseAnimations();
    }
    if (typeof svg.setCurrentTime === 'function') {
      svg.setCurrentTime(0);
    }
    if (typeof svg.unpauseAnimations === 'function') {
      svg.unpauseAnimations();
    }
  } catch {
    // Some browsers throw if SVG is detached
  }
}

function pauseSvgAnimations(svg               )       {
  try {
    if (typeof svg.pauseAnimations === 'function') {
      svg.pauseAnimations();
    }
  } catch {
    // ignore
  }
}

class DrawingController {
          canvas                   ;
          ctx                                 ;
          active = false;
          drawing = false;
          lastX = 0;
          lastY = 0;

  constructor(canvas                   ) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());

    this.canvas.addEventListener('pointerdown', (e) => {
      if (!this.active || !this.ctx) return;
      this.drawing = true;
      this.lastX = e.clientX;
      this.lastY = e.clientY;
      this.canvas.setPointerCapture(e.pointerId);
    });

    this.canvas.addEventListener('pointermove', (e) => {
      if (!this.active || !this.drawing || !this.ctx) return;
      this.ctx.strokeStyle = '#ff3b30';
      this.ctx.lineWidth = 3.5;
      this.ctx.lineCap = 'round';
      this.ctx.lineJoin = 'round';
      this.ctx.beginPath();
      this.ctx.moveTo(this.lastX, this.lastY);
      this.ctx.lineTo(e.clientX, e.clientY);
      this.ctx.stroke();
      this.lastX = e.clientX;
      this.lastY = e.clientY;
    });

    const endDraw = () => {
      this.drawing = false;
    };
    this.canvas.addEventListener('pointerup', endDraw);
    this.canvas.addEventListener('pointercancel', endDraw);
  }

  resize()       {
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth;
    const h = window.innerHeight;
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    if (this.ctx) {
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  toggle()          {
    this.active = !this.active;
    this.canvas.classList.toggle('drawing-active', this.active);
    return this.active;
  }

  isActive()          {
    return this.active;
  }

  clear()       {
    if (!this.ctx) return;
    this.ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  }
}

class LaserController {
          dot             ;
          holding = false;
          bus         ;
          lastX = 0.5;
          lastY = 0.5;

  constructor(dot             , bus         ) {
    this.dot = dot;
    this.bus = bus;

    window.addEventListener('mousemove', (e) => {
      this.lastX = e.clientX / Math.max(1, window.innerWidth);
      this.lastY = e.clientY / Math.max(1, window.innerHeight);
      if (this.holding) {
        this.showAt(this.lastX, this.lastY, true);
      }
    });
  }

  setHolding(holding         )       {
    if (this.holding === holding) return;
    this.holding = holding;
    if (holding) {
      this.showAt(this.lastX, this.lastY, true);
    } else {
      this.hide(true);
    }
  }

  showAt(normX        , normY        , broadcast         )       {
    this.dot.classList.remove('hidden');
    this.dot.style.left = `${normX * window.innerWidth}px`;
    this.dot.style.top = `${normY * window.innerHeight}px`;
    if (broadcast) {
      this.bus.send({
        type: 'laser',
        payload: { active: true, x: normX, y: normY },
      });
    }
  }

  hide(broadcast         )       {
    this.dot.classList.add('hidden');
    if (broadcast) {
      this.bus.send({
        type: 'laser',
        payload: { active: false, x: this.lastX, y: this.lastY },
      });
    }
  }
}

function renderSlidePreviewInto(
  container             ,
  deck          ,
  slideNum        ,
  stepNum        ,
  state                  ,
)       {
  container.innerHTML = '';
  if (slideNum < 1 || slideNum > deck.totalSlides) {
    const empty = document.createElement('div');
    empty.style.color = '#9aa5b8';
    empty.style.fontSize = '0.95rem';
    empty.textContent =
      slideNum === 0 ? 'Slide 0: Program Starter' : 'End of Presentation';
    container.appendChild(empty);
    return;
  }

  const slide = deck.slides[slideNum - 1];
  if (!slide) return;

  const grid = document.createElement('div');
  grid.className = 'slide-layers-grid';

  for (const layer of slide.layers) {
    if (layer.meta.step > stepNum) continue;
    if (!isLayerEligibleForState(layer, state)) continue;

    const slot = document.createElement('div');
    slot.className = 'layer-slot';
    slot.innerHTML = layer.svgMarkup;
    applySwitchLanguage(slot, state.activeLanguage);

    // Ensure SMIL entrance animations in preview settle visibly
    slot.querySelectorAll('svg').forEach((svg) => {
      try {
        if (typeof svg.setCurrentTime === 'function') {
          svg.setCurrentTime(60);
        }
        if (typeof svg.pauseAnimations === 'function') {
          svg.pauseAnimations();
        }
      } catch {
        // ignore if unsupported
      }
    });

    grid.appendChild(slot);
  }

  container.appendChild(grid);
}

function mountPresenterView(

)       {

  let state                   = {

  let elapsedSeconds = 0;
  let timerRunning = true;

  document.body.innerHTML = `
    <div class="presenter-layout">
      <div class="presenter-topbar">

        </div>
      </div>

      <div class="presenter-footer">
        <div style="display:flex; gap:0.5rem; align-items:center;">
          <button class="btn btn-sm" id="p-home" title="Slide 0">⌂</button>

        </div>
        <div class="presenter-controls-strip" id="p-controls-strip"></div>

          Synced via BroadcastChannel • <kbd>←</kbd> <kbd>→</kbd> <kbd>Space</kbd>
        </div>
      </div>
    </div>
  `;

  const titleEl = document.getElementById('p-slide-title') ;
  const currentEl = document.getElementById('p-current-preview') ;
  const nextLabelEl = document.getElementById('p-next-label') ;
  const nextEl = document.getElementById('p-next-preview') ;
  const notesEl = document.getElementById('p-notes') ;
  const controlsEl = document.getElementById('p-controls-strip') ;
  const elapsedEl = document.getElementById('p-elapsed') ;
  const clockEl = document.getElementById('p-clock') ;
  const timerToggleBtn = document.getElementById('p-timer-toggle') ;
  const timerResetBtn = document.getElementById('p-timer-reset') ;

  const formatDuration = (sec        )         => {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    return [h, m, s].map((v) => String(v).padStart(2, '0')).join(':');
  };

  const updateClocks = () => {
    elapsedEl.textContent = formatDuration(elapsedSeconds);

  timerToggleBtn.addEventListener('click', () => {

    if (deck.languages.length > 0) {

          ${deck.languages
            .map(
              (l) =>
                `<button class="btn btn-sm btn-pill ${l === state.activeLanguage ? 'is-active' : ''}" data-p-lang="${l}">${l.toUpperCase()}</button>`,
            )
            .join('')}
        </div>
      `);
    }

    for (const g of deck.groups) {
      parts.push(`
        <div class="presenter-ctrl-group">

          ${g.options
            .map((opt) => {
              const active = state.groupChoices[g.name] === opt.layerKey;
              const kbd = opt.shortcuts.map((s) => `<kbd>${s.display}</kbd>`).join(' ');
              return `<button class="btn btn-sm btn-pill ${active ? 'is-active' : ''}" data-p-group="${g.name}" data-p-key="${opt.layerKey}">${opt.title} ${kbd}</button>`;
            })
            .join('')}
        </div>
      `);
    }

    if (deck.toggles.length > 0) {
      parts.push(`
        <div class="presenter-ctrl-group">
          <span class="presenter-ctrl-label">Toggles</span>
          ${deck.toggles
            .map((t) => {
              const active = Boolean(state.toggles[t.layerKey]);
              const kbd = t.shortcuts.map((s) => `<kbd>${s.display}</kbd>`).join(' ');
              return `<button class="btn btn-sm ${active ? 'is-active' : ''}" data-p-toggle="${t.layerKey}">${t.title} ${kbd}</button>`;
            })
            .join('')}
        </div>
      `);
    }

    controlsEl.innerHTML = parts.join('');

    controlsEl.querySelectorAll             ('[data-p-lang]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const lang = btn.dataset.pLang ?? '';
        state.activeLanguage = lang;
        render();
        bus.send({ type: 'set-language', lang });
      });
    });

    controlsEl.querySelectorAll             ('[data-p-group]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.pGroup ?? '';
        const layerKey = btn.dataset.pKey ?? '';
        state.groupChoices[group] = layerKey;
        render();
        bus.send({ type: 'set-group', group, layerKey });
      });
    });

    controlsEl.querySelectorAll             ('[data-p-toggle]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const layerKey = btn.dataset.pToggle ?? '';
        state.toggles[layerKey] = !state.toggles[layerKey];
        render();
        bus.send({ type: 'toggle-filter', layerKey });
      });
    });
  };

  const render = () => {
    const slide =
      state.currentSlide >= 1 ? deck.slides[state.currentSlide - 1] : null;
    const steps = slide ? getAvailableStepsForSlide(slide, state) : [0];
    const maxStep = steps[steps.length - 1] ?? 0;
    const currentStepIdx = steps.indexOf(state.currentStep);

    titleEl.textContent =
      state.currentSlide === 0
        ? `Slide 0 (Starter) — ${deck.totalSlides} slides`
        : `Slide ${state.currentSlide} / ${deck.totalSlides} — ${slide?.title ?? ''} (Step ${state.currentStep}/${maxStep})`;

    renderSlidePreviewInto(
      currentEl,
      deck,
      state.currentSlide,
      state.currentStep,
      state,
    );

    let nextSlide = state.currentSlide;
    let nextStep = state.currentStep;
    if (state.currentSlide === 0) {
      nextSlide = deck.totalSlides > 0 ? 1 : 0;
      nextStep = 0;
    } else if (slide && currentStepIdx >= 0 && currentStepIdx < steps.length - 1) {
      nextStep = steps[currentStepIdx + 1];
    } else if (slide && state.currentStep < maxStep) {
      const nextAvailable = steps.find((s) => s > state.currentStep);
      if (nextAvailable !== undefined) {
        nextStep = nextAvailable;
      } else {
        nextSlide = state.currentSlide + 1;
        nextStep = 0;
      }
    } else {
      nextSlide = state.currentSlide + 1;
      nextStep = 0;
    }

    nextLabelEl.textContent =
      nextSlide > deck.totalSlides
        ? 'Next: End of Presentation'
        : `Next: Slide ${nextSlide}${nextStep > 0 ? ` (Step ${nextStep})` : ''}`;
    renderSlidePreviewInto(nextEl, deck, nextSlide, nextStep, state);

    notesEl.textContent =
      slide?.notes || 'No speaker notes for this slide.';

    renderControls();
  };

  bus.onMessage((msg) => {
    if (msg.type === 'state') {
      state = {
        ...msg.payload,
        groupChoices: { ...msg.payload.groupChoices },
        toggles: { ...msg.payload.toggles },
      };
      render();
    }
  });

  document.getElementById('p-home') .addEventListener('click', () => {
    bus.send({ type: 'nav', action: 'goto', slide: 0, step: 0 });
  });
  document.getElementById('p-prev') .addEventListener('click', () => {
    bus.send({ type: 'nav', action: 'prev' });
  });
  document.getElementById('p-next') .addEventListener('click', () => {
    bus.send({ type: 'nav', action: 'next' });
  });

  window.addEventListener('keydown', (e) => {
    for (const g of deck.groups) {
      for (const opt of g.options) {
        if (opt.shortcuts.some((sc) => eventMatchesShortcut(e, sc))) {
          e.preventDefault();
          state.groupChoices[g.name] = opt.layerKey;
          render();
          bus.send({ type: 'set-group', group: g.name, layerKey: opt.layerKey });
          return;
        }
      }
    }
    for (const t of deck.toggles) {
      if (t.shortcuts.some((sc) => eventMatchesShortcut(e, sc))) {
        e.preventDefault();
        state.toggles[t.layerKey] = !state.toggles[t.layerKey];
        render();
        bus.send({ type: 'toggle-filter', layerKey: t.layerKey });
        return;
      }
    }

    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
      e.preventDefault();
      bus.send({ type: 'nav', action: 'next' });
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      bus.send({ type: 'nav', action: 'prev' });
    } else if (e.key === 'Home' || e.key === '0') {
      e.preventDefault();
      bus.send({ type: 'nav', action: 'goto', slide: 0, step: 0 });
    }
  });

  render();
  bus.send({ type: 'request-state' });
}


// --- src/player/runtime.ts ---



class SlidePlayer {
          deck          ;
          bus         ;
          currentSlide = 0;
          currentStep = 0;
          activeLanguage = '';
          groupChoices                         = {};
          toggles                          = {};
          hudVisible = true;
          overviewOpen = false;

          starterEl              ;
          stageEl              ;
          slideContainer              ;
          hudEl              ;
          overviewEl              ;
          drawCtrl                    ;
          laserCtrl                  ;

          slideFrames                = [];

  constructor(
    deck          ,
    initialLang         ,
    initialFilters           ,
    skipStarterConfig          ,
  ) {
    this.deck = deck;
    this.bus = new SyncBus();

    const params = new URLSearchParams(window.location.search);
    const urlLang = params.get('language')?.toLowerCase() ?? '';
    this.activeLanguage =
      urlLang ||
      (initialLang ? initialLang.toLowerCase() : '') ||
      (deck.languages[0] ?? '');

    this.initFilterDefaults(initialFilters);

    if (params.get('presenter') === '1') {
      mountPresenterView(deck, this.getSyncState(), this.bus);
      return;
    }

    const skipParam =
      params.get('skipStarter') ?? params.get('skip0') ?? params.get('start');
    const shouldSkipStarter =
      skipStarterConfig === true ||
      skipParam === '1' ||
      skipParam === 'true';

    const slideParam = params.get('slide');
    if (slideParam !== null) {
      const n = Number.parseInt(slideParam, 10);
      if (!Number.isNaN(n) && n >= 0 && n <= deck.totalSlides) {
        this.currentSlide = n;
      }
    } else if (shouldSkipStarter && deck.totalSlides > 0) {
      this.currentSlide = 1;
    }

    const stepParam = params.get('step');
    if (stepParam !== null) {
      const s = Number.parseInt(stepParam, 10);
      if (!Number.isNaN(s) && s >= 0) {
        this.currentStep = s;
      }
    }

    this.mountStage();
    this.bindEvents();
    this.renderAll();
  }

          initFilterDefaults(initialFilters           )       {
    const filterSet = new Set(
      (initialFilters ?? []).map((f) => f.trim().toLowerCase()).filter(Boolean),
    );

    for (const g of this.deck.groups) {
      const matched = g.options.find(
        (o) =>
          filterSet.has(o.layerKey.toLowerCase()) ||
          filterSet.has(o.title.toLowerCase()),
      );
      const def = matched ?? g.options.find((o) => o.isDefault) ?? g.options[0];
      if (def) {
        this.groupChoices[g.name] = def.layerKey;
      }
    }

    for (const t of this.deck.toggles) {
      const forced =
        filterSet.has(t.layerKey.toLowerCase()) ||
        filterSet.has(t.title.toLowerCase());
      this.toggles[t.layerKey] = forced || t.isDefault;
    }
  }

         updateDeck(newDeck          )       {
    this.deck = newDeck;

    // Preserve existing language if still valid or fallback
    if (!this.activeLanguage && newDeck.languages.length > 0) {
      this.activeLanguage = newDeck.languages[0];
    }

    // Ensure any newly added groups/toggles get defaults without overwriting user choices
    for (const g of newDeck.groups) {
      if (!this.groupChoices[g.name]) {
        const def = g.options.find((o) => o.isDefault) ?? g.options[0];
        if (def) this.groupChoices[g.name] = def.layerKey;
      }
    }
    for (const t of newDeck.toggles) {
      if (this.toggles[t.layerKey] === undefined) {
        this.toggles[t.layerKey] = t.isDefault;
      }
    }

    if (this.currentSlide > newDeck.totalSlides) {
      this.currentSlide = newDeck.totalSlides;
      this.currentStep = 0;
    }

    this.renderAll();
  }

          getSyncState()                   {
    return {
      currentSlide: this.currentSlide,
      currentStep: this.currentStep,
      activeLanguage: this.activeLanguage,
      groupChoices: { ...this.groupChoices },
      toggles: { ...this.toggles },
    };
  }

          broadcastState()       {
    this.bus.send({ type: 'state', payload: this.getSyncState() });
  }

          mountStage()       {
    document.body.innerHTML = `
      <div class="stage-wrapper" id="stage-wrapper">
        <div class="slide-container" id="slide-container"></div>
      </div>
      <div class="starter-view" id="starter-view"></div>
      <div class="hud-bar" id="hud-bar"></div>
      <div class="overview-modal hidden" id="overview-modal"></div>
      <canvas class="draw-canvas" id="draw-canvas"></canvas>
      <div class="laser-dot hidden" id="laser-dot"></div>
    `;

    this.stageEl = document.getElementById('stage-wrapper') ;
    this.slideContainer = document.getElementById('slide-container') ;
    this.starterEl = document.getElementById('starter-view') ;
    this.hudEl = document.getElementById('hud-bar') ;
    this.overviewEl = document.getElementById('overview-modal') ;

    this.drawCtrl = new DrawingController(
      document.getElementById('draw-canvas')                     ,
    );
    this.laserCtrl = new LaserController(
      document.getElementById('laser-dot') ,
      this.bus,
    );
  }

          bindEvents()       {
    this.bus.onMessage((msg) => {
      if (msg.type === 'request-state') {
        this.broadcastState();
      } else if (msg.type === 'nav') {
        if (msg.action === 'next') this.next();
        else if (msg.action === 'prev') this.prev();
        else if (msg.action === 'goto' && msg.slide !== undefined) {
          this.goToSlide(msg.slide, msg.step ?? 0);
        }
      } else if (msg.type === 'set-language') {
        this.setLanguage(msg.lang);
      } else if (msg.type === 'set-group') {
        this.selectGroupOption(msg.group, msg.layerKey);
      } else if (msg.type === 'toggle-filter') {
        this.toggleFilter(msg.layerKey);
      } else if (msg.type === 'laser') {
        if (msg.payload.active) {
          this.laserCtrl.showAt(msg.payload.x, msg.payload.y, false);
        } else {
          this.laserCtrl.hide(false);
        }
      }
    });

    this.stageEl.addEventListener('click', (e) => {
      if (this.currentSlide === 0 || this.overviewOpen || this.drawCtrl.isActive()) {
        return;
      }
      if ((e.target               ).closest('#hud-bar')) return;
      this.next();
    });

    window.addEventListener('keydown', (e) => {
      const target = e.target                      ;
      if (
        target &&
        (target.tagName === 'INPUT' ||
          target.tagName === 'TEXTAREA' ||
          target.tagName === 'SELECT')
      ) {
        return;
      }

      // Check custom layer shortcuts (-s_...) first
      if (this.handleCustomShortcut(e)) {
        e.preventDefault();
        return;
      }

      const key = e.key;
      const lower = key.toLowerCase();

      if (lower === 'l') {
        this.laserCtrl.setHolding(true);
        return;
      }

      if (key === 'Escape') {
        e.preventDefault();
        this.toggleOverview();
        return;
      }

      if (lower === 'g') {
        e.preventDefault();
        this.toggleOverview();
        return;
      }

      if (lower === 'h') {
        e.preventDefault();
        this.hudVisible = !this.hudVisible;
        this.updateHudVisibility();
        return;
      }

      if (lower === 'd') {
        e.preventDefault();
        this.drawCtrl.toggle();
        this.renderHud();
        return;
      }

      if (lower === 'c') {
        e.preventDefault();
        this.drawCtrl.clear();
        return;
      }

      if (lower === 'p') {
        e.preventDefault();
        this.openPresenter();
        return;
      }

      if (lower === 'f') {
        e.preventDefault();
        this.toggleFullscreen();
        return;
      }

      if (key === 'Home' || key === '0') {
        e.preventDefault();
        this.goToSlide(0, 0);
        return;
      }

      if (key === 'ArrowRight' || key === ' ' || key === 'PageDown') {
        if (this.currentSlide === 0 && key === ' ') return;
        e.preventDefault();
        this.next();
      } else if (key === 'ArrowLeft' || key === 'PageUp') {
        e.preventDefault();
        this.prev();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key.toLowerCase() === 'l') {
        this.laserCtrl.setHolding(false);
      }
    });
  }

          handleCustomShortcut(e               )          {
    for (const g of this.deck.groups) {
      for (const opt of g.options) {
        if (opt.shortcuts.some((sc) => eventMatchesShortcut(e, sc))) {
          this.selectGroupOption(g.name, opt.layerKey);
          return true;
        }
      }
    }
    for (const t of this.deck.toggles) {
      if (t.shortcuts.some((sc) => eventMatchesShortcut(e, sc))) {
        this.toggleFilter(t.layerKey);
        return true;
      }
    }
    return false;
  }

         setLanguage(lang        )       {
    this.activeLanguage = lang.toLowerCase();
    const url = new URL(window.location.href);
    if (this.activeLanguage) {
      url.searchParams.set('language', this.activeLanguage);
    } else {
      url.searchParams.delete('language');
    }
    window.history.replaceState({}, '', url.toString());

    this.applyVisibilityAndAnimations(false);
    this.renderStarter();
    this.renderHud();
    if (this.overviewOpen) this.renderOverview();
    this.broadcastState();
  }

         selectGroupOption(groupName        , layerKey        )       {
    this.groupChoices[groupName] = layerKey;
    this.applyVisibilityAndAnimations(false);
    this.renderStarter();
    this.renderHud();
    this.broadcastState();
  }

         toggleFilter(layerKey        )       {
    this.toggles[layerKey] = !this.toggles[layerKey];
    this.applyVisibilityAndAnimations(false);
    this.renderStarter();
    this.renderHud();
    this.broadcastState();
  }

         next()       {
    if (this.currentSlide === 0) {
      if (this.deck.totalSlides > 0) {
        this.goToSlide(1, 0);
      }
      return;
    }

    const slide = this.deck.slides[this.currentSlide - 1];
    if (slide) {
      const steps = getAvailableStepsForSlide(slide, this.getSyncState());
      const nextStep = steps.find((s) => s > this.currentStep);
      if (nextStep !== undefined) {
        this.currentStep = nextStep;
        this.applyVisibilityAndAnimations(true, this.currentStep);
        this.renderHud();
        this.broadcastState();
        return;
      }
    }

    if (this.currentSlide < this.deck.totalSlides) {
      this.goToSlide(this.currentSlide + 1, 0);
    }
  }

         prev()       {
    if (this.currentSlide === 0) return;

    const slide = this.deck.slides[this.currentSlide - 1];
    if (slide && this.currentStep > 0) {
      const steps = getAvailableStepsForSlide(slide, this.getSyncState());
      const prevSteps = steps.filter((s) => s < this.currentStep);
      this.currentStep = prevSteps[prevSteps.length - 1] ?? 0;
      this.applyVisibilityAndAnimations(false);
      this.renderHud();
      this.broadcastState();
      return;
    }

    if (this.currentSlide > 1) {
      const prevSlide = this.deck.slides[this.currentSlide - 2];
      const prevSteps = prevSlide
        ? getAvailableStepsForSlide(prevSlide, this.getSyncState())
        : [0];
      const maxPrevStep = prevSteps[prevSteps.length - 1] ?? 0;
      this.goToSlide(this.currentSlide - 1, maxPrevStep);
    } else {
      this.goToSlide(0, 0);
    }
  }

         goToSlide(slideNum        , stepNum = 0)       {
    const clamped = Math.max(0, Math.min(this.deck.totalSlides, slideNum));
    this.currentSlide = clamped;
    const slide = clamped >= 1 ? this.deck.slides[clamped - 1] : null;
    this.currentStep = slide ? Math.max(0, Math.min(slide.maxStep, stepNum)) : 0;

    if (this.overviewOpen) {
      this.overviewOpen = false;
      this.overviewEl.classList.add('hidden');
    }

    this.drawCtrl.clear();
    this.updateSlideActivation(true);
    this.renderHud();
    this.broadcastState();
  }

         openPresenter()       {
    const url = new URL(window.location.href);
    url.searchParams.set('presenter', '1');
    window.open(url.toString(), 'slidesv-presenter', 'width=1280,height=760');
    setTimeout(() => this.broadcastState(), 350);
  }

         toggleFullscreen()       {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.().catch(() => {});
    }
  }

         toggleOverview()       {
    this.overviewOpen = !this.overviewOpen;
    this.overviewEl.classList.toggle('hidden', !this.overviewOpen);
    if (this.overviewOpen) {
      this.renderOverview();
    }
  }

          renderAll()       {
    this.buildSlideFrames();
    this.renderStarter();
    this.updateSlideActivation(true);
    this.renderHud();
    if (this.overviewOpen) this.renderOverview();
    this.broadcastState();
  }

          buildSlideFrames()       {
    this.slideContainer.innerHTML = '';
    this.slideFrames = [];

    for (const slide of this.deck.slides) {
      const frame = document.createElement('div');
      frame.className = 'slide-frame';
      frame.dataset.slide = String(slide.index);
      frame.dataset.transition = slide.transition;

      const grid = document.createElement('div');
      grid.className = 'slide-layers-grid';

      for (const layer of slide.layers) {
        const slot = document.createElement('div');
        slot.className = 'layer-slot';
        slot.dataset.filename = layer.meta.filename;
        slot.dataset.step = String(layer.meta.step);
        slot.dataset.band = layer.meta.band;
        slot.dataset.group = layer.meta.group ?? '';
        slot.dataset.langs = layer.meta.languages.join(',');
        slot.dataset.hasShortcuts = layer.meta.shortcuts.length > 0 ? '1' : '0';
        slot.dataset.isDefault = isLayerDefaultActive(layer.meta) ? '1' : '0';
        slot.innerHTML = layer.svgMarkup;
        grid.appendChild(slot);
      }

      frame.appendChild(grid);
      this.slideContainer.appendChild(frame);
      this.slideFrames.push(frame);
    }
  }

          isLayerEligible(layer               , stepLimit        )          {
    const { meta } = layer;
    if (meta.step > stepLimit) return false;
    if (
      meta.languages.length > 0 &&
      this.activeLanguage &&
      !meta.languages.includes(this.activeLanguage)
    ) {
      return false;
    }
    if (meta.group !== null) {
      return this.groupChoices[meta.group] === meta.filename;
    }
    if (meta.shortcuts.length > 0) {
      return Boolean(this.toggles[meta.filename]);
    }
    return true;
  }

          updateSlideActivation(resetAnimations         )       {
    const isStarter = this.currentSlide === 0;
    this.starterEl.classList.toggle('hidden', !isStarter);
    this.updateHudVisibility();

    for (const frame of this.slideFrames) {
      const num = Number.parseInt(frame.dataset.slide ?? '0', 10);
      const isActive = num === this.currentSlide;
      frame.classList.toggle('active', isActive);

      if (!isActive) {
        frame.querySelectorAll('svg').forEach((svg) => {
          pauseSvgAnimations(svg);
        });
      }
    }

    this.applyVisibilityAndAnimations(resetAnimations);
  }

          applyVisibilityAndAnimations(
    resetAnimations         ,
    onlyStep         ,
  )       {
    for (let i = 0; i < this.deck.slides.length; i += 1) {
      const slide = this.deck.slides[i];
      const frame = this.slideFrames[i];
      if (!frame) continue;

      const isActiveSlide = slide.index === this.currentSlide;
      const slots = frame.querySelectorAll             ('.layer-slot');

      slide.layers.forEach((layer, idx) => {
        const slot = slots[idx];
        if (!slot) return;

        const visible = this.isLayerEligible(layer, isActiveSlide ? this.currentStep : 0);
        slot.classList.toggle('layer-hidden', !visible);

        if (visible) {
          applySwitchLanguage(slot, this.activeLanguage);
        }

        if (isActiveSlide && visible && resetAnimations) {
          if (onlyStep === undefined || layer.meta.step === onlyStep) {
            slot.querySelectorAll('svg').forEach((svg) => {
              resetAndPlaySvgAnimations(svg);
            });
          }
        }
      });
    }
  }

          updateHudVisibility()       {
    const hide = !this.hudVisible || this.currentSlide === 0;
    this.hudEl.classList.toggle('hidden', hide);
  }

          renderStarter()       {
    const notesCount = this.deck.slides.filter((s) => s.notes.trim().length > 0).length;

    const langHtml =
      this.deck.languages.length > 0
        ? `
          <div class="starter-section">
            <h2>Language</h2>
            <div class="pill-row">
              ${this.deck.languages
                .map(
                  (l) => `
                  <button class="btn btn-sm btn-pill ${l === this.activeLanguage ? 'is-active' : ''}" data-action="lang" data-lang="${l}">
                    ${l.toUpperCase()}
                  </button>`,
                )
                .join('')}
            </div>
          </div>`
        : '';

    const groupsHtml =
      this.deck.groups.length > 0
        ? `
          <div class="starter-section">
            <h2>Filter Groups</h2>
            ${this.deck.groups
              .map(
                (g) => `
                <div class="group-block">
                  <div class="group-name">${g.name}</div>
                  <div class="pill-row">
                    ${g.options
                      .map((opt) => {
                        const active = this.groupChoices[g.name] === opt.layerKey;
                        const kbd = opt.shortcuts
                          .map((s) => `<kbd>${s.display}</kbd>`)
                          .join(' ');
                        return `<button class="btn btn-sm btn-pill ${active ? 'is-active' : ''}" data-action="group" data-group="${g.name}" data-key="${opt.layerKey}">
                          ${opt.title} ${kbd}
                        </button>`;
                      })
                      .join('')}
                  </div>
                </div>`,
              )
              .join('')}
          </div>`
        : '';

    const togglesHtml =
      this.deck.toggles.length > 0
        ? `
          <div class="starter-section">
            <h2>Overlay &amp; Layer Toggles</h2>
            <div class="pill-row">
              ${this.deck.toggles
                .map((t) => {
                  const active = Boolean(this.toggles[t.layerKey]);
                  const kbd = t.shortcuts
                    .map((s) => `<kbd>${s.display}</kbd>`)
                    .join(' ');
                  return `<button class="btn btn-sm ${active ? 'is-active' : ''}" data-action="toggle" data-key="${t.layerKey}">
                    ${t.title} ${kbd}
                  </button>`;
                })
                .join('')}
            </div>
          </div>`
        : '';

    this.starterEl.innerHTML = `
      <div class="starter-card">
        <div class="starter-header">
          <div class="starter-title">
            <h1>Slide 0 — Presentation Control Hub</h1>
            <p>Built ${this.deck.buildDate} • Zero-dependency SVG Presentation Engine</p>
          </div>
          <div class="starter-actions">
            <button class="btn" id="btn-open-presenter">Open Presenter View <kbd>P</kbd></button>
            <button class="btn btn-primary" id="btn-start-pres">Start Presentation →</button>
          </div>
        </div>

        <div class="starter-stats">
          <div class="stat-box">
            <div class="stat-label">Total Slides</div>
            <div class="stat-value">${this.deck.totalSlides}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Languages</div>
            <div class="stat-value">${this.deck.languages.length || 'Default'}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Speaker Notes</div>
            <div class="stat-value">${notesCount} / ${this.deck.totalSlides}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Filters &amp; Groups</div>
            <div class="stat-value">${this.deck.toggles.length + this.deck.groups.length}</div>
          </div>
        </div>

        ${langHtml}
        ${groupsHtml}
        ${togglesHtml}

        <div class="shortcuts-help">
          <span><kbd>→</kbd> <kbd>Space</kbd> Next</span>
          <span><kbd>←</kbd> Previous</span>
          <span><kbd>G</kbd> / <kbd>Esc</kbd> Overview</span>
          <span><kbd>P</kbd> Presenter</span>
          <span>Hold <kbd>L</kbd> Laser</span>
          <span><kbd>D</kbd> Draw (<kbd>C</kbd> Clear)</span>
          <span><kbd>H</kbd> Toggle HUD</span>
          <span><kbd>F</kbd> Fullscreen</span>
        </div>
      </div>
    `;

    this.starterEl
      .querySelector('#btn-start-pres')
      ?.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.().catch(() => {});
        }
        this.goToSlide(1, 0);
      });

    this.starterEl
      .querySelector('#btn-open-presenter')
      ?.addEventListener('click', () => {
        this.openPresenter();
      });

    this.starterEl
      .querySelectorAll             ('[data-action="lang"]')
      .forEach((btn) => {
        btn.addEventListener('click', () => {
          this.setLanguage(btn.dataset.lang ?? '');
        });
      });

    this.starterEl
      .querySelectorAll             ('[data-action="group"]')
      .forEach((btn) => {
        btn.addEventListener('click', () => {
          this.selectGroupOption(
            btn.dataset.group ?? '',
            btn.dataset.key ?? '',
          );
        });
      });

    this.starterEl
      .querySelectorAll             ('[data-action="toggle"]')
      .forEach((btn) => {
        btn.addEventListener('click', () => {
          this.toggleFilter(btn.dataset.key ?? '');
        });
      });
  }

          renderHud()       {
    const slide =
      this.currentSlide >= 1 ? this.deck.slides[this.currentSlide - 1] : null;
    const steps = slide ? getAvailableStepsForSlide(slide, this.getSyncState()) : [0];
    const maxStep = steps[steps.length - 1] ?? 0;
    const stepText =
      slide && maxStep > 0
        ? ` (${this.currentStep}/${maxStep})`
        : '';

    const langSelect =
      this.deck.languages.length > 0
        ? `<select class="hud-select" id="hud-lang-select" title="Language">
            ${this.deck.languages
              .map(
                (l) =>
                  `<option value="${l}" ${l === this.activeLanguage ? 'selected' : ''}>${l.toUpperCase()}</option>`,
              )
              .join('')}
          </select>`
        : '';

    const toggleButtons = this.deck.toggles
      .map((t) => {
        const active = Boolean(this.toggles[t.layerKey]);
        return `<button class="btn btn-sm ${active ? 'is-active' : ''}" data-hud-toggle="${t.layerKey}" title="${t.shortcuts.map((s) => s.display).join(', ')}">${t.title}</button>`;
      })
      .join('');

    this.hudEl.innerHTML = `
      <button class="btn btn-sm" id="hud-home" title="Slide 0 Starter">⌂</button>
      <button class="btn btn-sm" id="hud-prev" title="Previous">←</button>
      <span class="hud-counter">${this.currentSlide} / ${this.deck.totalSlides}${stepText}</span>
      <button class="btn btn-sm" id="hud-next" title="Next">→</button>
      <span class="hud-sep"></span>
      ${langSelect}
      ${toggleButtons}
      <button class="btn btn-sm ${this.drawCtrl.isActive() ? 'is-active' : ''}" id="hud-draw" title="Draw (D) / Clear (C)">✏️</button>
      <button class="btn btn-sm" id="hud-grid" title="Overview Grid (G)">⊞</button>
      <button class="btn btn-sm" id="hud-presenter" title="Presenter View (P)">🖥</button>
      <button class="btn btn-sm" id="hud-fs" title="Fullscreen (F)">⛶</button>
    `;

    this.hudEl.querySelector('#hud-home')?.addEventListener('click', () => {
      this.goToSlide(0, 0);
    });
    this.hudEl.querySelector('#hud-prev')?.addEventListener('click', () => {
      this.prev();
    });
    this.hudEl.querySelector('#hud-next')?.addEventListener('click', () => {
      this.next();
    });
    this.hudEl
      .querySelector('#hud-lang-select')
      ?.addEventListener('change', (e) => {
        this.setLanguage((e.target                     ).value);
      });
    this.hudEl
      .querySelectorAll             ('[data-hud-toggle]')
      .forEach((btn) => {
        btn.addEventListener('click', () => {
          this.toggleFilter(btn.dataset.hudToggle ?? '');
        });
      });
    this.hudEl.querySelector('#hud-draw')?.addEventListener('click', () => {
      this.drawCtrl.toggle();
      this.renderHud();
    });
    this.hudEl.querySelector('#hud-grid')?.addEventListener('click', () => {
      this.toggleOverview();
    });
    this.hudEl
      .querySelector('#hud-presenter')
      ?.addEventListener('click', () => {
        this.openPresenter();
      });
    this.hudEl.querySelector('#hud-fs')?.addEventListener('click', () => {
      this.toggleFullscreen();
    });
  }

          renderOverview()       {
    this.overviewEl.innerHTML = `
      <div class="overview-header">
        <h2>Slide Overview (${this.deck.totalSlides} slides)</h2>
        <button class="btn btn-sm" id="overview-close">Close <kbd>Esc</kbd></button>
      </div>
      <div class="overview-grid" id="overview-grid"></div>
    `;

    this.overviewEl
      .querySelector('#overview-close')
      ?.addEventListener('click', () => {
        this.toggleOverview();
      });

    const grid = this.overviewEl.querySelector('#overview-grid') ;
    for (const slide of this.deck.slides) {
      const card = document.createElement('div');
      card.className = `overview-card ${slide.index === this.currentSlide ? 'current' : ''}`;

      const thumb = document.createElement('div');
      thumb.className = 'overview-thumb';
      const layersGrid = document.createElement('div');
      layersGrid.className = 'slide-layers-grid';

      for (const layer of slide.layers) {
        if (!this.isLayerEligible(layer, 0)) continue;
        const slot = document.createElement('div');
        slot.className = 'layer-slot';
        slot.innerHTML = layer.svgMarkup;
        applySwitchLanguage(slot, this.activeLanguage);
        layersGrid.appendChild(slot);
      }

      thumb.appendChild(layersGrid);

      const meta = document.createElement('div');
      meta.className = 'overview-meta';
      meta.innerHTML = `<span>${slide.title}</span><span class="overview-num">#${slide.index}</span>`;

      card.appendChild(thumb);
      card.appendChild(meta);
      card.addEventListener('click', () => {
        this.goToSlide(slide.index, 0);
      });
      grid.appendChild(card);
    }
  }
}
