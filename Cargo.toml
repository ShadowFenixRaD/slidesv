[package]
name = "svg-deck"
version = "1.1.0"
edition = "2024"
description = "Standalone zero-dependency SVG presentation compiler"

[[bin]]
name = "svg-deck"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
notify = "7.0"
regex = "1.11"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
strip = true
opt-level = "s"
