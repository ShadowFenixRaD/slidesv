<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="masterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <style>.m-txt { font-family: sans-serif; fill: #f8fafc; }</style>

  <g inkscape:label="master_accent-underlay_2">
    <rect x="40" y="660" width="220" height="4" rx="2" fill="url(#masterGrad)" opacity="0.6" />
  </g>

  <g id="viewport" transform="translate(20, 10)">
    <g inkscape:label="slide_3" style="display:none">
      <desc>Slide 3 (Tier 2): Extracted from single_master.svg with step 1 &amp; step 2.</desc>
      <text x="60" y="120" class="m-txt" font-size="42" font-weight="700">Slide 3 — Tier 2 Multi-Layer Master</text>
      <rect x="60" y="175" width="350" height="140" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
      <text x="85" y="250" class="m-txt" font-size="22">Step 0: Base &lt;g&gt;</text>
    </g>

    <g inkscape:label="slide_3-step_1" visibility="hidden">
      <rect x="440" y="175" width="350" height="140" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
      <text x="465" y="250" class="m-txt" font-size="22">
        Step 1: SMIL Reveal
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="indefinite" fill="freeze" />
      </text>
    </g>

    <g inkscape:label="slide_3-step_2" opacity="0">
      <rect x="820" y="175" width="350" height="140" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
      <text x="845" y="250" class="m-txt" font-size="22">Step 2: Preserved Transform</text>
    </g>

    <g inkscape:label="slide_4">
      <desc>Slide 4 (Tier 2): Second slide inside single_master.svg with Alt+N toggle.</desc>
      <text x="60" y="120" class="m-txt" font-size="42" font-weight="700">Slide 4 — Tier 2 Second Slide</text>
      <rect x="60" y="190" width="1110" height="180" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2" />
      <text x="95" y="285" class="m-txt" font-size="24">Press Alt+N (or toggle in HUD/Presenter) for callout</text>
      <g id="4-empty_marker"/>
    </g>

    <g id="4-callout_alt_n-s_alt_n" style="display:none">
      <rect x="60" y="400" width="1110" height="120" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2" />
      <text x="95" y="468" class="m-txt" font-size="24">Alt+N Callout Active!</text>
    </g>
  </g>
</svg>
