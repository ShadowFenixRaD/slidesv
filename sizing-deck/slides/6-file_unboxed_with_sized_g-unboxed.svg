<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1280px" height="720px">
  <g inkscape:label="base_unboxed">
    <rect x="40px" y="40px" width="1200px" height="640px" fill="none" stroke="#f43f5e" stroke-width="3px" />
    <g font-family="sans-serif" fill="#f8fafc">
      <switch>
        <text x="80px" y="130px" font-size="38px" font-weight="700" systemLanguage="en">6. File -unboxed + &lt;g&gt; -sized</text>
        <text x="80px" y="130px" font-size="38px" font-weight="700" systemLanguage="it">6. File -unboxed + &lt;g&gt; -sized</text>
        <text x="80px" y="130px" font-size="38px" font-weight="700">6. File -unboxed</text>
      </switch>
    </g>
  </g>
  <g inkscape:label="inner_sized-sized">
    <rect x="80px" y="210px" width="420px" height="120px" rx="12px" fill="#1e293b" stroke="#38bdf8" stroke-width="2px" />
    <text x="110px" y="278px" font-family="sans-serif" font-size="20px" fill="#bae6fd">&lt;g data-sized="1"&gt; (420px × 120px untouched)</text>
  </g>
</svg>
