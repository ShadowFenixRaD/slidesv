<svg xmlns="http://www.w3.org/2000/svg" width="1280px" height="720px">
  <rect x="30px" y="30px" width="1220px" height="660px" fill="none" stroke="#f59e0b" stroke-width="6px" stroke-dasharray="16 10" />
  <g font-family="sans-serif" fill="#f8fafc" text-anchor="middle">
    <switch>
      <g systemLanguage="en">
        <text x="640px" y="320px" font-size="46px" font-weight="700">3. File -unboxed</text>
        <text x="640px" y="380px" font-size="24px" fill="#fcd34d">Stretches to 100% width &amp; height (preserveAspectRatio="none")</text>
      </g>
      <g systemLanguage="it">
        <text x="640px" y="320px" font-size="46px" font-weight="700">3. File -unboxed</text>
        <text x="640px" y="380px" font-size="24px" fill="#fcd34d">Si adatta a 100% larghezza e altezza (preserveAspectRatio="none")</text>
