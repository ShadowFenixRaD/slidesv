<svg xmlns="http://www.w3.org/2000/svg" width="520px" height="220px">
  <rect x="4px" y="4px" width="512px" height="212px" rx="14px" fill="#1e1b4b" stroke="#818cf8" stroke-width="3px" />
  <g font-family="sans-serif" fill="#f8fafc" text-anchor="middle">
    <switch>
      <g systemLanguage="en">
        <text x="260px" y="95px" font-size="26px" font-weight="700">4. File -sized (520px × 220px)</text>
        <text x="260px" y="140px" font-size="16px" fill="#c7d2fe">Exact pixel dimensions preserved (untouched by compiler)</text>
      </g>
      <g systemLanguage="it">
        <text x="260px" y="95px" font-size="26px" font-weight="700">4. File -sized (520px × 220px)</text>
        <text x="260px" y="140px" font-size="16px" fill="#c7d2fe">Dimensioni esatte in px preservate (non toccate dal compilatore)</text>
